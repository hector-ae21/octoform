name: GitHub API contract drift

on:
  schedule:
    - cron: '37 4 * * 3'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-api-contract-drift
  cancel-in-progress: true

jobs:
  audit:
    name: REST and GraphQL contract drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Compare reviewed and current contracts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-github-api-drift.mjs --report "$RUNNER_TEMP/github-api-drift.md"
      - name: Publish audit summary
        if: always()
        run: cat "$RUNNER_TEMP/github-api-drift.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "Contract audit did not produce a report." >> "$GITHUB_STEP_SUMMARY"
