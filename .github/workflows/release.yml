name: Release

# The normal path is dispatched by ci.yml on the immutable tag created from a
# protected version branch. The pull request has already passed the complete
# verification matrix, so this workflow validates release identity and builds
# only the package that it is about to publish.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: validate release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pkg.outputs.version }}
      name: ${{ steps.pkg.outputs.name }}
      should_publish: ${{ steps.mode.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Read package metadata
        id: pkg
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"

      - name: Resolve release mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publishing requires a version tag
        if: steps.mode.outputs.publish == 'true'
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*.*.*) ;;
            *)
              echo "::error::Publishing must run from a version tag, got $GITHUB_REF"
              exit 1
              ;;
          esac

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="${{ steps.pkg.outputs.version }}"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Version must be valid semver
        run: |
          echo "${{ steps.pkg.outputs.version }}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::Invalid semver: ${{ steps.pkg.outputs.version }}"; exit 1; }

      - name: CHANGELOG must mention this version
        run: |
          grep -q "\[${{ steps.pkg.outputs.version }}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no entry for ${{ steps.pkg.outputs.version }}"; exit 1; }

      - name: Version must not already exist on npm
        if: steps.mode.outputs.publish == 'true'
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already published"
            exit 1
          fi

  # Publish via npm trusted publishing (OIDC) — no long-lived npm token stored
  # in the repo. This requires a trusted publisher to be configured on
  # npmjs.com for this exact package/owner/repo/workflow/environment
  # combination BEFORE the first publish — see CONTRIBUTING.md.
  publish:
    name: publish to npm
    if: always() && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    environment:
      name: npm
      url: https://www.npmjs.com/package/${{ needs.validate.outputs.name }}/v/${{ needs.validate.outputs.version }}
    permissions:
      contents: write # to create the GitHub Release after a successful publish
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: package-lock.json

      # Trusted publishing requires npm >= 11.5.1. The npm bundled with the
      # runner's Node install can be older than that — it will happily sign
      # provenance but cannot exchange GitHub's OIDC token for a registry
      # credential, so it must be upgraded explicitly before publishing.
      - name: Install npm with trusted publishing support
        run: |
          npm install --global npm@11.19.0
          npm --version

      - run: npm ci --ignore-scripts

      # CONFIRMED in production on another package: the short-lived credential
      # `npm publish --provenance` gets from the OIDC id-token is scoped to
      # that one publish call and does NOT carry over to a later, separate
      # `npm dist-tag add` in the same job — it 401s. So the tag is decided
      # here, before publishing, and handed to `npm publish --tag` directly;
      # no separate registry-write call is ever needed and NPM_TOKEN stays
      # unnecessary.
      #
      # The highest-numbered major always gets 'latest', full stop — never its
      # own 'vNx' tag, since 'latest' already serves that purpose. Only a
      # major that is NOT the current highest gets tagged 'vNx', so
      # `npm install @hector21/octoform@v0x` keeps resolving to the newest 0.x
      # patch on its own once a 1.x exists. No dot in the tag name on purpose:
      # npm's own arg parsing treats a bare "v0.x" as a semver range
      # (>=0.0.0 <1.0.0) before it ever considers dist-tags, which would
      # silently bypass this tag rather than use it.
      #
      # While v0.x is the only line, this always resolves to 'latest' — the
      # branching only starts to matter once a second major exists.
      - name: Determine npm dist-tag
        id: npm-tag
        if: needs.validate.outputs.should_publish == 'true'
        env:
          PKG: ${{ needs.validate.outputs.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          HIGHEST=$(npm view "$PKG" versions --json 2>/dev/null | node -e "
            let data = [];
            try { data = JSON.parse(require('fs').readFileSync(0, 'utf8')); } catch {}
            data = [].concat(data).filter(Boolean);
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              return 0;
            };
            console.log(data.sort(cmp).pop() ?? '');
          ")

          IS_HIGHEST=$(node -e "
            const cmp = (a, b) => {
              const pa = a.split('.').map(Number), pb = b.split('.').map(Number);
              for (let i = 0; i < 3; i++) { if (pa[i] !== pb[i]) return pa[i] - pb[i]; }
              return 0;
            };
            const [version, highest] = process.argv.slice(1);
            console.log(!highest || cmp(version, highest) >= 0);
          " "$VERSION" "$HIGHEST")

          echo "Highest published so far: ${HIGHEST:-none yet} — publishing: $VERSION"
          if [ "$IS_HIGHEST" = "true" ]; then
            echo "New overall highest — tag: latest"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "is_highest=true" >> "$GITHUB_OUTPUT"
          else
            MAJOR="${VERSION%%.*}"
            MAJOR_TAG="v${MAJOR}x"
            echo "Patch on an older, non-highest major — tag: $MAJOR_TAG (never touches latest)"
            echo "tag=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
            echo "is_highest=false" >> "$GITHUB_OUTPUT"
          fi

      # Authentication is exclusively OIDC trusted publishing. Do not add a
      # NODE_AUTH_TOKEN / NPM_TOKEN env var back here.
      - name: Publish
        if: needs.validate.outputs.should_publish == 'true'
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --provenance

      - name: Dry run
        if: needs.validate.outputs.should_publish == 'false'
        run: npm publish --dry-run

      - name: Extract CHANGELOG section for this version
        if: needs.validate.outputs.should_publish == 'true'
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > /tmp/release-notes.md

      - name: Create GitHub Release
        if: needs.validate.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ github.ref_name }}
          IS_HIGHEST: ${{ steps.npm-tag.outputs.is_highest }}
        run: |
          # --latest is set from the same highest-semver check that picked the
          # dist-tag, not left to gh's default of "most recently created",
          # which marks a backport to an old major as the latest release.
          if gh release view "$VERSION_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $VERSION_TAG already exists"
          elif [ -s /tmp/release-notes.md ]; then
            gh release create "$VERSION_TAG" \
              --verify-tag \
              --title "$VERSION_TAG" \
              --notes-file /tmp/release-notes.md \
              --latest="$IS_HIGHEST"
          else
            gh release create "$VERSION_TAG" \
              --verify-tag \
              --title "$VERSION_TAG" \
              --generate-notes \
              --latest="$IS_HIGHEST"
          fi

      - name: Published summary
        if: needs.validate.outputs.should_publish == 'true'
        run: |
          echo "### Published \`${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "https://www.npmjs.com/package/${{ needs.validate.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Dry-run summary
        if: needs.validate.outputs.should_publish == 'false'
        run: echo "### Dry run completed for \`${{ needs.validate.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
