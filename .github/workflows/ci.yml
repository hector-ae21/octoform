name: CI

# Runs on pull requests and on pushes to a version branch. Version branches
# are named vMAJOR.x (v0.x today) — one per major line that is still alive,
# with the highest one as the default branch. See SECURITY.md for what that
# scheme means for which versions get fixes.
on:
  push:
    branches: ['v*.x']
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The suite runs once on the pull request. A push to a vX.x branch is a merge
  # that already passed this required gate, so it proceeds directly to tagging.
  test:
    name: node ${{ matrix.node }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Verification must not change tracked files
        run: git diff --exit-code

  # Single stable name for branch protection to require. Matrix job names
  # change whenever the matrix does, which makes them fragile as a required
  # check; this one never changes and only succeeds once every entry above did.
  verify:
    name: CI complete
    if: always() && github.event_name == 'pull_request'
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "::error::One or more Node versions failed."
            exit 1
          fi

  # A tag pushed with GITHUB_TOKEN does not trigger another workflow
  # automatically, so create the missing version tag once a version branch
  # moves, then explicitly dispatch the release workflow on that tag rather
  # than relying on the push-to-tag trigger to fire on its own. Matches vN.x
  # for any maintained major without edits here.
  release:
    name: tag and start release
    if: >-
      always() &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/heads/v') &&
      (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Read package version
        id: package
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the version tag exists
        id: tag
        env:
          VERSION_TAG: ${{ steps.package.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create version tag
        if: steps.tag.outputs.exists == 'false'
        env:
          VERSION_TAG: ${{ steps.package.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Use this version's own CHANGELOG.md section as the annotated tag
          # message when there is one, the same extraction release.yml uses
          # for the GitHub Release body, so the tag itself carries the notes
          # instead of a bare "Release vX.Y.Z".
          VERSION="${VERSION_TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '1{/^$/d}' > /tmp/tag-message.md

          {
            echo "Release $VERSION_TAG"
            if [ -s /tmp/tag-message.md ]; then
              echo
              cat /tmp/tag-message.md
            fi
          } > /tmp/tag-message-final.md

          git tag -a "$VERSION_TAG" -F /tmp/tag-message-final.md
          git push origin "$VERSION_TAG"

      - name: Start release workflow
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.package.outputs.tag }}
        run: gh workflow run release.yml --ref "$VERSION_TAG" -f dry_run=false
