# octoform configuration.
#
# Everything specific to your setup lives here. octoform itself knows nothing
# about npm, Moodle, or what any of these type names mean.
#
# Every setting is tri-state:
#
#   true       enforce it on
#   false      enforce it off, and correct it if someone turns it on
#   omitted    not managed, leave whatever the repository already has
#
# The difference between `false` and omitting is the point: `false` is a
# policy, omitting is staying out of the way. Nothing has a default in the
# code, so an empty configuration file changes nothing.
#
# Precedence, widest to narrowest, key by key:
#   defaults -> types.<type> -> repos.<name>
#
# Escape hatches, narrowest to widest:
#   repos.<name>.<key>: null   stop managing that one setting there
#   repos.<name>.manage: false audit it, apply nothing
#   exclude.repos: [...]       drop it entirely

# A GitHub organisation or a personal account — octoform asks the API which
# one this is, so nothing else in this file changes either way. The main
# practical difference: a personal account has no custom properties API, so
# `classify.property` below simply does not apply there, and every type comes
# from `repos.<name>.type` or from `classify.rules` instead. See
# examples/personal-account/ for a configuration that only ever manages one
# person's own repositories.
owner: example-org

# Split this file across several and pull them back together. Useful for a
# set of type presets shared across more than one owner: put `types` and
# `defaults` in a file with no `owner` of its own, and import it wherever it
# applies. Paths are relative to the file that lists them, and can nest.
# Listed most general first: a later import overrides an earlier one, and
# this file's own content overrides every import. See examples/shared-presets/.
#
# imports:
#   - presets/npm-library.yml
#   - presets/security-baseline.yml

# Where a repository's type comes from. Omit this block and everything falls
# under `defaults`. The custom property is the usual source on an
# organisation; a type declared under `repos:` wins over it, which is what
# lets this work on plans that do not offer custom properties, and is the
# only source available on a personal account.
classify:
  property: project-type
  rules:
    - when: { file_exists: version.php }
      type: moodle-plugin
    - when: { file_exists: package.json, json: { private: true } }
      type: frontend-app
    - when: { file_exists: package.json }
      type: npm-package

# Read-only expectations. These never change anything; they exist so that
# "every public repository needs a description" is configuration, not code.
audit:
  require_type: true
  require_description: { visibility: public }
  require_topics: { visibility: public }
  max_topics: 8

defaults:
  features:
    issues: true
    wiki: false
    projects: false
    # discussions is not listed at all, so it is left alone everywhere.
  merge:
    allow_squash: true
    allow_merge_commit: false
    allow_rebase: false
    delete_branch_on_merge: true
  security:
    vulnerability_alerts: true
    automated_security_fixes: true
    private_vulnerability_reporting: true
  # Renaming the default branch is the one change here that is visible outside
  # the repository's settings, so it is deliberately hard to trigger by
  # accident: `rename_from` lists the names you are willing to rename, and a
  # repository whose default branch is not one of them is reported and left
  # alone rather than renamed anyway. `plan` also names any workflow file that
  # mentions the old branch — GitHub redirects the branch itself, but a
  # workflow that says `branches: [master]` keeps parsing fine and quietly
  # stops matching anything.
  default_branch:
    name: main
    rename_from: [master]

# `target_branches` accepts a literal branch name, `~DEFAULT_BRANCH` (whatever
# that repository's default branch is, so it survives a rename), or a glob.
# What to name your branches and how many maintenance lines to keep is a
# decision for your own project, not something octoform prescribes — the
# three types below make three different, equally arbitrary choices, and
# examples/branch-patterns/ walks through more.
types:
  npm-package:
    environments:
      - name: npm
    files:
      # `from` is a local path, resolved against THIS file — so a preset that
      # is imported from somewhere else still finds the files sitting next to
      # it. `create-if-missing` is the only mode, and deliberately: seeding
      # what is absent is safe, overwriting whatever a repository already has
      # at that path is not.
      - path: .github/dependabot.yml
        from: files/dependabot/npm.yml
        mode: create-if-missing
    rulesets:
      - name: default-branch
        target_branches: ['~DEFAULT_BRANCH']
        required_approvals: 1
        required_checks: [verify]
        block_force_push: true
        block_deletion: true

  moodle-plugin:
    ensure_branches: [main]
    files:
      - path: .github/dependabot.yml
        from: files/dependabot/composer.yml
        mode: create-if-missing
    rulesets:
      - name: main-branch
        target_branches: [main]
        required_approvals: 1
        required_checks: ['CI complete']
        block_force_push: true
        block_deletion: true

  service:
    rulesets:
      - name: default-branch
        target_branches: ['~DEFAULT_BRANCH']
        required_approvals: 1
        block_force_push: true
        block_deletion: true

# Per-repository overrides and anything that is inherently per-repository,
# such as description and topics.
repos:
  docs-site:
    features: { issues: true }
    repo:
      description: Public documentation site
      homepage: https://example.org
      topics: [documentation, static-site]

  legacy-tool:
    manage: false # inventoried and audited, but nothing is applied

exclude:
  repos: [scratch, fork-of-something]
